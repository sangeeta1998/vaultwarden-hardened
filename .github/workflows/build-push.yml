name: Build, scan, sign, and push hardened Vaultwarden image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      vaultwarden_ref:
        description: "Upstream dani-garcia/vaultwarden git tag to build from"
        required: false
        default: "1.37.3"

permissions:
  contents: read
  id-token: write   # required for keyless cosign signing via GitHub OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: vaultwarden-hardened
      VAULTWARDEN_REF: ${{ inputs.vaultwarden_ref || '1.37.3' }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout pinned upstream Vaultwarden source
        run: |
          git clone --branch "${VAULTWARDEN_REF}" --depth 1 \
            https://github.com/dani-garcia/vaultwarden.git vw-src

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VAULTWARDEN_REF }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./vw-src
          file: ./docker/Dockerfile.hardened
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VW_VERSION=${{ env.VAULTWARDEN_REF }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"   # report only; set to "1" to fail the build on findings

      - name: Generate SBOM (SPDX) with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ env.VAULTWARDEN_REF }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via GitHub OIDC)
        run: |
          cosign sign --yes \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM to the image (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
